<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Ikona — provjera veličina</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
  <style>
    body { margin: 0; }
  </style>

</head>
<body>

<div style="width: 512px; height: 512px; box-sizing: border-box; background: #0C1014; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="flex-grow: 1; background: #E9ECEF; display: flex; align-items: center; justify-content: center; gap: 34px">

      <span style="width: 96px; height: 96px; border-radius: 21px; background: #2FD39B; display: flex; align-items: center; justify-content: center; overflow: hidden">
        <svg width="96" height="96" viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="150" fill="none" stroke="#06231A" stroke-width="58" stroke-linecap="round" stroke-dasharray="811 131" transform="rotate(-20 256 256)"></circle></svg>
      </span>
      <span style="font-size: 11px; font-weight: 700; color: #4A5560">96 px</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="width: 64px; height: 64px; border-radius: 14px; background: #2FD39B; display: flex; align-items: center; justify-content: center; overflow: hidden">

      </span>

        <svg width="48" height="48" viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="150" fill="none" stroke="#06231A" stroke-width="58" stroke-linecap="round" stroke-dasharray="811 131" transform="rotate(-20 256 256)"></circle></svg>
      </span>
      <span style="font-size: 11px; font-weight: 700; color: #4A5560">48 px</span>
    </div>
  </div>

  <div style="flex-grow: 1; background: #16181C; display: flex; align-items: center; justify-content: center; gap: 34px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="width: 96px; height: 96px; border-radius: 50%; background: #2FD39B; display: flex; align-items: center; justify-content: center; overflow: hidden">
        <svg width="96" height="96" viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="150" fill="none" stroke="#06231A" stroke-width="58" stroke-linecap="round" stroke-dasharray="811 131" transform="rotate(-20 256 256)"></circle></svg>
      </span>
      <span style="font-size: 11px; font-weight: 700; color: #97A3B2">okrugla maska</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span style="width: 96px; height: 96px; border-radius: 30px; background: #2FD39B; display: flex; align-items: center; justify-content: center; overflow: hidden">

      </span>
      <span style="font-size: 11px; font-weight: 700; color: #97A3B2">zaobljeni kvadrat</span>

      <span style="width: 96px; height: 96px; border-radius: 21px; background: #0E1B16; display: flex; align-items: center; justify-content: center; overflow: hidden">
        <svg width="96" height="96" viewBox="0 0 512 512" aria-hidden="true"><circle cx="256" cy="256" r="150" fill="none" stroke="#2FD39B" stroke-width="58" stroke-linecap="round" stroke-dasharray="811 131" transform="rotate(-20 256 256)"></circle></svg>
      </span>
      <span style="font-size: 11px; font-weight: 700; color: #97A3B2">A, za usporedbu</span>

</div>

</body>
</html>
