<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>Postavljanje plana</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2FD39B; } a:hover { color: #6FE2BD; }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .sw { width: 46px; height: 28px; border-radius: 14px; background: #2A323D; position: relative; display: inline-block; flex-shrink: 0; transition: background .18s ease; }
    .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #F3F5F7; transition: transform .18s ease; }
    input:checked + .sw { background: #2FD39B; }
    input:checked + .sw::after { transform: translateX(18px); }
    input:focus-visible + .sw { outline: 2px solid #8FB8FF; outline-offset: 2px; }
  </style>

</head>
<body>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C1014; color: #F3F5F7; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; padding: 26px 20px 0">
    <a href="Dodaj.dc.html" aria-label="Natrag na odabir servisa" style="width: 40px; height: 40px; border-radius: 13px; border: 1px solid #263040; background: #161C23; color: #F3F5F7; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m6-7-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em">Postavi plan</h1>
  </header>

  <div style="display: flex; align-items: center; gap: 12px; margin: 18px 20px 0; padding: 12px 14px; border-radius: 17px; background: #161C23; border: 1px solid #1E252E">
    <span style="width: 42px; height: 42px; border-radius: 13px; background: #111C33; color: #7FB0FF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0">D</span>
    <span style="flex-grow: 1">
      <span style="display: block; font-size: 15px; font-weight: 700">Disney+</span>
      <span style="display: block; font-size: 12px; color: #97A3B2; font-weight: 600; margin-top: 2px">Standard s reklamama</span>
    </span>
    <button type="button" style="min-height: 36px; padding: 0 13px; border-radius: 11px; border: 1px solid #37424F; background: transparent; color: #C8D1DB; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer">Promijeni</button>
  </div>

  <div style="display: flex; gap: 10px; margin: 12px 20px 0">
    <div style="flex-grow: 1; padding: 12px 14px; border-radius: 16px; background: #161C23; border: 1px solid #1E252E">
      <label for="cijena" style="display: block; font-size: 11px; color: #97A3B2; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Cijena</label>
      <div style="display: flex; align-items: baseline; gap: 5px; margin-top: 5px">
        <input id="cijena" type="text" value="9,99" inputmode="decimal" style="width: 62px; background: transparent; border: 0; outline: none; color: #F3F5F7; font-family: inherit; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 0">
        <span style="font-size: 15px; font-weight: 700; color: #97A3B2">€</span>
      </div>
    </div>
    <button type="button" style="flex-grow: 1; padding: 12px 14px; border-radius: 16px; background: #161C23; border: 1px solid #1E252E; color: #F3F5F7; font-family: inherit; text-align: left; cursor: pointer">
      <span style="display: block; font-size: 11px; color: #97A3B2; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Ciklus</span>
      <span style="display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 15px; font-weight: 700">
        Mjesečno
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E6B7A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </span>
    </button>
  </div>

  <section style="margin: 16px 20px 0; border-radius: 18px; background: #1F1810; border: 1px solid #3D3118; overflow: hidden">
    <label style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 15px; cursor: pointer">
      <span style="flex-grow: 1">
        <span style="display: block; font-size: 14px; font-weight: 700; color: #FFC75A">Sada sam u probnom periodu</span>
        <span style="display: block; font-size: 11.5px; color: #D7BE8B; font-weight: 500; margin-top: 2px">Javit ćemo ti prije prve naplate</span>
      </span>
      <input type="checkbox" class="vh" checked>
      <span class="sw" aria-hidden="true"></span>
    </label>
    <div style="padding: 0 15px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid #3A2F18">
        <span style="font-size: 13px; color: #E6DCC6; font-weight: 600">Probni period traje do</span>
        <span style="font-size: 13px; font-weight: 800; color: #FFC75A">5. 10. 2026.</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid #3A2F18">
        <span style="font-size: 13px; color: #E6DCC6; font-weight: 600">Nakon toga plaćam</span>
        <span style="font-size: 13px; font-weight: 800; color: #FFC75A; font-variant-numeric: tabular-nums">9,99 € / mj</span>
      </div>
    </div>
  </section>

  <section style="margin: 12px 20px 0; border-radius: 18px; background: #161C23; border: 1px solid #1E252E; overflow: hidden">
    <label style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 15px; cursor: pointer">
      <span style="flex-grow: 1">
        <span style="display: block; font-size: 14px; font-weight: 700">Imam promo cijenu</span>
        <span style="display: block; font-size: 11.5px; color: #97A3B2; font-weight: 500; margin-top: 2px">Prvih nekoliko mjeseci po nižoj cijeni</span>
      </span>
      <input type="checkbox" class="vh" checked>
      <span class="sw" aria-hidden="true"></span>
    </label>
    <div style="padding: 0 15px 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid #222A34">
        <span style="font-size: 13px; color: #C8D1DB; font-weight: 600">Promo cijena</span>
        <span style="font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums">2,99 € / mj</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid #222A34">
        <span style="font-size: 13px; color: #C8D1DB; font-weight: 600">Trajanje promocije</span>
        <span style="font-size: 13px; font-weight: 800">3 mjeseca</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-top: 1px solid #222A34">
        <span style="font-size: 13px; color: #C8D1DB; font-weight: 600">Puna cijena od 5. 1. 2027.</span>
        <span style="font-size: 13px; font-weight: 800; color: #FF8168; font-variant-numeric: tabular-nums">9,99 €</span>
      </div>
    </div>
  </section>

  <button type="button" style="display: flex; align-items: center; margin: 12px 20px 0; min-height: 52px; width: calc(100% - 40px); padding: 0 15px; border-radius: 16px; background: #161C23; border: 1px solid #1E252E; color: #F3F5F7; font-family: inherit; cursor: pointer; text-align: left">
    <span style="flex-grow: 1; font-size: 14px; font-weight: 600">Dan naplate</span>
    <span style="font-size: 13px; color: #97A3B2; font-weight: 700; margin-right: 8px">5. u mjesecu</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6B7A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
  </button>

  <div style="margin-top: auto; padding: 16px 20px 24px">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 16px; background: #2FD39B; color: #06170F; text-decoration: none; font-size: 15px; font-weight: 800">Dodaj u Obol</a>
    <p style="margin: 11px 0 0; font-size: 11.5px; color: #97A3B2; font-weight: 500; text-align: center; line-height: 1.45">Dok traje probni period ili promocija, u ukupan mjesečni trošak ulazi niža cijena.</p>
  </div>

</div>

</body>
</html>
